<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock Onboarding Survey</title>
    <style>
      body {
        font: 14px/1.5 system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      fieldset {
        margin: 0 0 1.25rem;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      .field {
        margin-bottom: 1.25rem;
      }
      label {
        display: block;
      }
      input[type='text'],
      textarea,
      select {
        width: 100%;
        padding: 0.4rem;
        box-sizing: border-box;
      }
      .error {
        color: #b91c1c;
        font-size: 12px;
      }
      #page2,
      #done {
        display: none;
      }
      .honeypot {
        position: absolute;
        left: -9999px;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <h1>Mock Onboarding Survey</h1>

    <form id="page1" novalidate>
      <div class="field">
        <label for="full-name">What is your full name?</label>
        <input id="full-name" name="full_name" type="text" maxlength="40" required />
        <span class="error" data-for="full-name" hidden>This field is required.</span>
      </div>

      <div class="field">
        <label for="role">What is your role?</label>
        <select id="role" name="role" required>
          <option value="">Choose...</option>
          <option value="eng">Engineering</option>
          <option value="design">Design</option>
          <option value="ops">Operations</option>
        </select>
      </div>

      <fieldset>
        <legend>Do you own a car?</legend>
        <label><input type="radio" name="owns_car" value="yes" required /> Yes</label>
        <label><input type="radio" name="owns_car" value="no" /> No</label>
      </fieldset>

      <fieldset>
        <legend>Which tools do you use? (select all that apply)</legend>
        <label><input type="checkbox" name="tools" value="git" /> Git</label>
        <label><input type="checkbox" name="tools" value="docker" /> Docker</label>
        <label><input type="checkbox" name="tools" value="k8s" /> Kubernetes</label>
      </fieldset>

      <div class="field">
        <label for="satisfaction">How satisfied are you? (1-10)</label>
        <input id="satisfaction" name="satisfaction" type="range" min="1" max="10" />
      </div>

      <div class="field">
        <label for="comments">Any other comments?</label>
        <textarea id="comments" name="comments" rows="3" maxlength="200"></textarea>
      </div>

      <!-- Present so the harness can prove it reports rather than fills this. -->
      <div class="honeypot">
        <label for="trap">Leave this blank</label>
        <input id="trap" name="trap_field" type="text" />
      </div>
      <input type="hidden" name="csrf" value="fixture-token" />

      <button type="button" id="next">Next</button>
    </form>

    <form id="page2" novalidate>
      <div class="field">
        <label for="oil-brand">What brand of motor oil do you buy?</label>
        <input id="oil-brand" name="oil_brand" type="text" />
      </div>
      <div class="field">
        <label for="mileage">Annual mileage?</label>
        <input id="mileage" name="mileage" type="number" min="0" max="200000" />
      </div>
      <button type="button" id="submit">Submit</button>
    </form>

    <div id="done"><h2>Thanks, your response was recorded.</h2></div>

    <script>
      const page1 = document.getElementById('page1');
      const page2 = document.getElementById('page2');
      const done = document.getElementById('done');

      document.getElementById('next').addEventListener('click', () => {
        // Required-field enforcement the harness is meant to detect.
        let valid = true;
        for (const el of page1.querySelectorAll('[required]')) {
          const empty =
            el.type === 'radio'
              ? !page1.querySelector(`[name="${el.name}"]:checked`)
              : !el.value.trim();
          const error = page1.querySelector(`.error[data-for="${el.id}"]`);
          if (empty) {
            valid = false;
            if (error) error.hidden = false;
          } else if (error) {
            error.hidden = true;
          }
        }
        if (!valid) return;

        page1.style.display = 'none';
        page2.style.display = 'block';
      });

      document.getElementById('submit').addEventListener('click', () => {
        page2.style.display = 'none';
        done.style.display = 'block';
      });
    </script>
  </body>
</html>
